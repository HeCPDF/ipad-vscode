name: Simulator Test

# The Simulator boot/UI-test/log-capture step, deliberately a fully
# separate workflow from build.yml rather than a job it calls inline --
# build.yml changes rarely; this one changes often (iterating on the test
# script itself, reproducibility repeats, etc.), and the two shouldn't
# share a single workflow run just because one happens to need the
# other's artifact. Three ways it runs, all downloading the
# `simulator-test-build` artifact (app + compiled UI test bundle +
# .xctestrun) build.yml's `build` job uploads -- never recompiles itself:
#   - Automatically, via `workflow_run`, whenever the Build workflow
#     completes successfully -- pulls the artifact from that same
#     triggering run (github.event.workflow_run.id).
#   - Standalone (workflow_dispatch, `run_id` required) against ANY prior
#     successful `build` job's artifact -- for reproducibility testing
#     (does an intermittent failure, e.g. the app dying silently ~45-60s
#     into UI test interaction with no crash report, repeat on the exact
#     same already-built binary?) or iterating on this test script itself
#     without paying the ~5 minutes build.yml's own `build` job needs.
#     Only works against a `build` job run after the commit that
#     introduced the `simulator-test-build` artifact; older runs won't
#     have it.
#   - workflow_call, for any other workflow that wants to reuse this
#     (nothing currently does, kept as a clean extension point).

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_call:
    inputs:
      run_id:
        type: string
        required: false
        default: ""
      repeat:
        type: string
        required: false
        default: "1"
  workflow_dispatch:
    inputs:
      run_id:
        description: "ipad-vscode Build workflow run ID to pull the simulator-test-build artifact from (must postdate this workflow's introduction)"
        required: true
      repeat:
        description: "How many times to repeat install+launch+UI-test in a row (for reproducibility testing)"
        required: false
        default: "1"

jobs:
  test:
    name: Boot Simulator + run UI tests
    # workflow_run fires on every completion, success or failure -- a
    # failed Build has no simulator-test-build artifact to pull (the job
    # that uploads it never ran), so skip rather than fail noisily.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    steps:
      - name: Runner memory/CPU
        run: |
          sysctl hw.memsize hw.ncpu hw.physicalcpu
          vm_stat

      # No checkout, no xcodegen, no compile -- the whole point of this
      # workflow existing separately is to skip all of that and reuse
      # what the `build` job already produced.
      - name: Download simulator-test-build artifact (same run, via workflow_call)
        if: github.event_name == 'workflow_call' && inputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: simulator-test-build
          path: /tmp/derived-sim/Build/Products

      - name: Download simulator-test-build artifact (triggering Build run, via workflow_run)
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/derived-sim/Build/Products
          gh run download "${{ github.event.workflow_run.id }}" --repo ${{ github.repository }} --name simulator-test-build --dir /tmp/derived-sim/Build/Products

      - name: Download simulator-test-build artifact (explicit run_id, cross-run)
        if: github.event_name != 'workflow_run' && inputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/derived-sim/Build/Products
          gh run download "${{ inputs.run_id }}" --repo ${{ github.repository }} --name simulator-test-build --dir /tmp/derived-sim/Build/Products

      - name: Resolve app/xctestrun paths
        run: |
          APP_PATH=$(find /tmp/derived-sim/Build/Products -maxdepth 2 -name 'iPadVSCode.app' | head -1)
          XCTESTRUN=$(find /tmp/derived-sim/Build/Products -maxdepth 1 -name '*.xctestrun' | head -1)
          if [ -z "$APP_PATH" ] || [ -z "$XCTESTRUN" ]; then
            echo "::error::could not find iPadVSCode.app and/or *.xctestrun under /tmp/derived-sim/Build/Products -- was the artifact from a build job old enough to predate build-for-testing?"
            find /tmp/derived-sim -maxdepth 3
            exit 1
          fi
          echo "resolved app_path=$APP_PATH"
          echo "resolved xctestrun=$XCTESTRUN"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "XCTESTRUN=$XCTESTRUN" >> "$GITHUB_ENV"

      - name: Boot Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt in d.values() for x in rt if 'iPad Pro' in x['name']))")
          echo "using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # Each iteration: fresh install (uninstall first so no state carries
      # over from a prior iteration), launch + screenshot + log capture
      # (mirrors build.yml's "Boot Simulator, install, launch,
      # screenshot"), then the UI test itself via test-without-building
      # (no recompiling), then a post-test log re-capture (mirrors
      # build.yml's "Capture node-stdio.log after UI tests") since a
      # silent mid-test exit needs its own capture, not just the
      # pre-test one. Never let one iteration's failure stop the loop --
      # the whole point of repeating is to see which iterations fail and
      # which don't.
      - name: Repeat install + launch + UI test + log capture
        env:
          # inputs.repeat is unset for a workflow_run trigger (inputs
          # only comes from workflow_dispatch/workflow_call) -- default
          # to a single pass there rather than feeding an empty string to
          # `seq`.
          REPEAT_COUNT: ${{ inputs.repeat || '1' }}
        run: |
          mkdir -p artifacts
          for i in $(seq 1 "$REPEAT_COUNT"); do
            echo "::group::Iteration $i"
            xcrun simctl uninstall "$SIM_UDID" com.hecpdf.ipadvscode || true
            xcrun simctl install "$SIM_UDID" "$APP_PATH"
            sleep 2

            xcrun simctl launch "$SIM_UDID" com.hecpdf.ipadvscode \
              || echo "::warning::simctl launch failed on iteration $i -- continuing for diagnostics"
            # 8s was only ever long enough to see the extension host's
            # *first* connection attempt land -- every bug found so far
            # in this window was a startup-time crash, never anything
            # that only shows up once extensions have had real time to
            # activate. 45s gives code-server, the extension host, and
            # built-in extensions genuine room to finish starting up
            # before this snapshot, so a real activation-time bug (as
            # opposed to a startup-time one) has an actual chance to
            # surface here instead of being missed by construction.
            sleep 45
            xcrun simctl io "$SIM_UDID" screenshot "artifacts/launch-$i.png" || true
            xcrun simctl spawn "$SIM_UDID" log show --predicate 'subsystem CONTAINS "com.hecpdf.ipadvscode"' --last 1m > "artifacts/simulator-log-$i-pre-uitest.txt" || true

            CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" com.hecpdf.ipadvscode data 2>/dev/null || true)
            NODE_LOG="$CONTAINER/Documents/Diagnostics/node-stdio.log"
            cp "$NODE_LOG" "artifacts/node-stdio-$i-pre-uitest.log" 2>/dev/null || echo "(no node-stdio.log yet for iteration $i)"

            # Backgrounded (not a plain foreground run) so this loop can
            # take periodic screenshots while the UI test suite is
            # actually running -- previously the *only* screenshot this
            # workflow ever took was the one above, before any UI test
            # starts, so NativeWorkbenchUITests's native workbench (only
            # ever opened from inside that test, never at ordinary
            # launch) had no visual evidence at all, only inferred
            # console-forwarder log state. 8s between shots, covering
            # the whole suite (OpenFolderFlowUITests then
            # NativeWorkbenchUITests, each with real ~40s observation
            # sleeps), so several land during the native workbench's
            # window without needing to guess its exact timing.
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -resultBundlePath "/tmp/uitest-results-$i.xcresult" \
              > "artifacts/uitest-xcodebuild-$i.log" 2>&1 &
            XCODEBUILD_PID=$!
            n=0
            while kill -0 "$XCODEBUILD_PID" 2>/dev/null; do
              n=$((n+1))
              xcrun simctl io "$SIM_UDID" screenshot "artifacts/uitest-screenshot-$i-$n.png" 2>/dev/null || true
              sleep 8
            done
            wait "$XCODEBUILD_PID" || echo "::warning::UI test failed on iteration $i"
            [ -d "/tmp/uitest-results-$i.xcresult" ] && cp -R "/tmp/uitest-results-$i.xcresult" "artifacts/uitest-results-$i.xcresult" || true

            CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" com.hecpdf.ipadvscode data 2>/dev/null || true)
            NODE_LOG="$CONTAINER/Documents/Diagnostics/node-stdio.log"
            cp "$NODE_LOG" "artifacts/node-stdio-$i-post-uitest.log" 2>/dev/null || echo "(no node-stdio.log for iteration $i)"
            xcrun simctl spawn "$SIM_UDID" log show --predicate 'subsystem CONTAINS "com.hecpdf.ipadvscode"' --last 5m > "artifacts/simulator-log-$i-post-uitest.txt" || true
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-test-results
          path: artifacts
