name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Compile + Simulator smoke test + UI tests
    # Needs the iOS/iPadOS 26 SDK (project.yml's deploymentTarget), which
    # only ships with Xcode 26+ — not present on macos-15.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch NodeMobile.xcframework from the nodejs-mobile fork
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          run_id=$(gh run list --repo HeCPDF/nodejs-mobile --workflow Build --status success --branch main -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::no successful nodejs-mobile Build run found"
            exit 1
          fi
          echo "using nodejs-mobile run $run_id"
          gh run download "$run_id" --repo HeCPDF/nodejs-mobile --name nodejs-mobile-ios --dir /tmp/nodejs-mobile-ios
          mkdir -p Frameworks
          cp -R /tmp/nodejs-mobile-ios/NodeMobile.xcframework Frameworks/

      - name: Fetch and trim code-server build from the code-server fork
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          run_id=$(gh run list --repo HeCPDF/code-server --workflow Build --status success --branch main -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::no successful code-server Build run found"
            exit 1
          fi
          echo "using code-server run $run_id"
          gh run download "$run_id" --repo HeCPDF/code-server --name linux-x64-package --dir /tmp/code-server-pkg
          mkdir -p /tmp/code-server-release
          tar -xzf /tmp/code-server-pkg/package.tar.gz -C /tmp/code-server-release
          bash scripts/trim-code-server.sh /tmp/code-server-release/release
          mkdir -p Sources/NodeRuntimeExtension/Resources/code-server
          cp -R /tmp/code-server-release/release/. Sources/NodeRuntimeExtension/Resources/code-server/
          echo "--- resources on disk before xcodegen generate ---"
          ls -la Sources/NodeRuntimeExtension/Resources/
          find Sources/NodeRuntimeExtension/Resources/code-server -maxdepth 1 | head -5
          find Sources/NodeRuntimeExtension/Resources/code-server | wc -l

      - name: Generate Xcode project
        run: xcodegen generate

      # A prior build had zero resource-copy activity for NodeRuntimeExtension
      # at all — not even the tiny placeholder server.js — despite the files
      # genuinely existing on disk at generate time (confirmed by the
      # diagnostic in the step above), and grepping the generated pbxproj's
      # CI log text found zero occurrences of "server.js"/"code-server"
      # anywhere. GitHub's log viewer virtualizes long step output, so
      # reading it back through the browser was unreliable for confirming
      # that grep result byte-for-byte — upload the raw pbxproj itself as an
      # artifact instead, so it can be downloaded and inspected directly.
      - uses: actions/upload-artifact@v4
        with:
          name: generated-pbxproj
          path: iPadVSCode.xcodeproj/project.pbxproj

      - name: Build (no code signing, generic device)
        run: |
          xcodebuild build \
            -project iPadVSCode.xcodeproj \
            -scheme iPadVSCode \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # `xcodebuild build` for a generic (non-archive) destination does not
      # reliably run the same resource-copy/embed-binary phases a real
      # distributable product needs — confirmed by a prior IPA produced
      # this way being ~375KB with no code-server payload or NodeMobile
      # framework binaries inside the .appex bundles at all. `archive` is
      # the actual product-export code path and does run them fully; it
      # still works unsigned with CODE_SIGNING_ALLOWED=NO. No Apple
      # Developer account or signing certificate is available in this
      # pipeline either way, so the result can't be installed as-is — it's
      # meant to be re-signed with the user's own certificate/provisioning
      # profile (Sideloadly, AltStore/SideStore, or a manual
      # `codesign`/zsign pass) before installing on a real iPad.
      - name: Archive (unsigned) for a real, complete .app product
        id: archive
        run: |
          xcodebuild archive \
            -project iPadVSCode.xcodeproj \
            -scheme iPadVSCode \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/iPadVSCode.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO
          APP_PATH=/tmp/iPadVSCode.xcarchive/Products/Applications/iPadVSCode.app
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          du -sh "$APP_PATH"
          find "$APP_PATH/PlugIns" -maxdepth 1

      # An IPA is just a zip of Payload/<App>.app — no special tooling
      # needed to produce one from the archived .app.
      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -R "${{ steps.archive.outputs.app_path }}" ipa/Payload/
          cd ipa
          zip -r -y ../iPadVSCode-unsigned.ipa Payload
          cd ..
          ls -la iPadVSCode-unsigned.ipa
          unzip -l iPadVSCode-unsigned.ipa | tail -30

      - uses: actions/upload-artifact@v4
        with:
          name: iPadVSCode-unsigned-ipa
          path: iPadVSCode-unsigned.ipa

      # The Simulator needs no code signing at all, and — unlike the device
      # build above — can actually be booted and launched right here in CI.
      # This is a real runtime smoke test, not just a compile check: it
      # proves the app launches and SwiftUI renders without crashing. It is
      # NOT proof the NEPacketTunnelProvider extensions work — Apple's
      # Network Extension framework has long-standing, well-known gaps in
      # Simulator support, so NodeRuntimeExtension/ExtensionHostRuntime
      # activating is not expected to be exercised by this test. See
      # README.md for what this does and doesn't establish.
      - name: Build for Simulator
        id: sim_build
        run: |
          DERIVED_DATA=/tmp/derived-sim
          xcodebuild build \
            -project iPadVSCode.xcodeproj \
            -scheme iPadVSCode \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5)' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH=$(find "$DERIVED_DATA/Build/Products" -maxdepth 2 -name 'iPadVSCode.app' | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Boot Simulator, install, launch, screenshot
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt in d.values() for x in rt if 'iPad Pro' in x['name']))")
          echo "using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "${{ steps.sim_build.outputs.app_path }}"
          xcrun simctl launch "$UDID" com.hecpdf.ipadvscode
          sleep 8
          mkdir -p artifacts
          xcrun simctl io "$UDID" screenshot artifacts/simulator-launch.png
          xcrun simctl spawn "$UDID" log show --predicate 'subsystem CONTAINS "com.hecpdf.ipadvscode"' --last 1m > artifacts/simulator-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke-test
          path: artifacts

      # Actual UI automation (XCUITest), not just "launched and didn't
      # crash": taps the real Open Folder button and confirms the system
      # document picker sheet actually comes up. This is the one flow that
      # doesn't depend on either NEPacketTunnelProvider extension, so
      # Simulator's Network Extension gaps don't affect it.
      - name: Run UI tests
        run: |
          xcodebuild test \
            -project iPadVSCode.xcodeproj \
            -scheme iPadVSCode \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5)' \
            -resultBundlePath /tmp/uitest-results.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export UI test result bundle
        if: always()
        run: |
          mkdir -p artifacts
          [ -d /tmp/uitest-results.xcresult ] && cp -R /tmp/uitest-results.xcresult artifacts/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: artifacts/uitest-results.xcresult
