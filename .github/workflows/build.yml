name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Compile + package (device IPA + Simulator test build)
    # Needs the iOS/iPadOS 26 SDK (project.yml's deploymentTarget), which
    # only ships with Xcode 26+ — not present on macos-15.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # Answers a real, previously-unverified question rather than
      # assuming a number: GitHub-hosted macOS runner memory has changed
      # across labels/generations over time, and guessing it risks being
      # stale. Directly relevant to whether the app dying silently ~45-60s
      # into UI test interaction (no crash report generated -- see git
      # history) could be memory pressure on the runner itself, not just
      # the Simulator/app.
      - name: Runner memory/CPU
        run: |
          sysctl hw.memsize hw.ncpu hw.physicalcpu
          vm_stat

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch NodeMobile.xcframework from the nodejs-mobile fork
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          run_id=$(gh run list --repo HeCPDF/nodejs-mobile --workflow Build --status success --branch main -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::no successful nodejs-mobile Build run found"
            exit 1
          fi
          echo "using nodejs-mobile run $run_id"
          gh run download "$run_id" --repo HeCPDF/nodejs-mobile --name nodejs-mobile-ios --dir /tmp/nodejs-mobile-ios
          mkdir -p Frameworks
          cp -R /tmp/nodejs-mobile-ios/NodeMobile.xcframework Frameworks/

      - name: Fetch and trim code-server build from the code-server fork
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          run_id=$(gh run list --repo HeCPDF/code-server --workflow Build --status success --branch main -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::no successful code-server Build run found"
            exit 1
          fi
          echo "using code-server run $run_id"
          gh run download "$run_id" --repo HeCPDF/code-server --name linux-x64-package --dir /tmp/code-server-pkg
          mkdir -p /tmp/code-server-release
          tar -xzf /tmp/code-server-pkg/package.tar.gz -C /tmp/code-server-release
          bash scripts/trim-code-server.sh /tmp/code-server-release/release
          mkdir -p Sources/App/Resources/code-server
          cp -R /tmp/code-server-release/release/. Sources/App/Resources/code-server/
          echo "--- resources on disk before xcodegen generate ---"
          ls -la Sources/App/Resources/
          find Sources/App/Resources/code-server -maxdepth 1 | head -5
          find Sources/App/Resources/code-server | wc -l

      - name: Generate Xcode project
        run: xcodegen generate

      # Kept as a standing diagnostic (not just a one-off): a prior build
      # had zero resource-copy activity for the app's code-server resources
      # at all — not even the tiny placeholder server.js — despite the
      # files genuinely existing on disk at generate time, traced back to
      # XcodeGen's separate top-level `resources:` key silently not being
      # wired into the generated project (see project.yml's comment on why
      # `sources:` + `buildPhase: resources` is used instead). Uploading
      # the raw pbxproj lets that class of bug be checked directly if it
      # ever recurs, without fighting GitHub's log-viewer virtualization.
      - uses: actions/upload-artifact@v4
        with:
          name: generated-pbxproj
          path: iPadVSCode.xcodeproj/project.pbxproj

      - name: Build (no code signing, generic device)
        run: |
          xcodebuild build \
            -project iPadVSCode.xcodeproj \
            -scheme iPadVSCode \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # `xcodebuild build` for a generic (non-archive) destination does not
      # reliably run the same resource-copy/embed-binary phases a real
      # distributable product needs — confirmed by a prior IPA produced
      # this way being ~375KB with no code-server payload or NodeMobile
      # framework binary at all. `archive` is the actual product-export
      # code path and does run them fully; it still works unsigned with
      # CODE_SIGNING_ALLOWED=NO. No Apple Developer account or signing
      # certificate is available in this pipeline either way (also no
      # longer needed for the app itself to run — see README.md — only
      # for the sideload install step), so the result can't be installed
      # as-is: it's meant to be re-signed with the user's own
      # certificate/provisioning profile (Sideloadly, AltStore/SideStore,
      # or a manual `codesign`/zsign pass) before installing on a real
      # iPad.
      - name: Archive (unsigned) for a real, complete .app product
        id: archive
        run: |
          xcodebuild archive \
            -project iPadVSCode.xcodeproj \
            -scheme iPadVSCode \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/iPadVSCode.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO
          APP_PATH=/tmp/iPadVSCode.xcarchive/Products/Applications/iPadVSCode.app
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          du -sh "$APP_PATH"

      # An IPA is just a zip of Payload/<App>.app — no special tooling
      # needed to produce one from the archived .app.
      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -R "${{ steps.archive.outputs.app_path }}" ipa/Payload/
          cd ipa
          zip -r -y ../iPadVSCode-unsigned.ipa Payload
          cd ..
          ls -la iPadVSCode-unsigned.ipa
          unzip -l iPadVSCode-unsigned.ipa | tail -30

      - uses: actions/upload-artifact@v4
        with:
          name: iPadVSCode-unsigned-ipa
          path: iPadVSCode-unsigned.ipa

      # The Simulator needs no code signing at all, and — unlike the device
      # build above — can actually be booted and launched right here in CI.
      # This is a real runtime smoke test, not just a compile check: it
      # proves the app launches and SwiftUI renders without crashing. It is
      # NOT proof code-server's Node runtime behaves identically to a real
      # device: Simulator doesn't enforce real iOS codesigning restrictions
      # (e.g. the JIT/dynamic-codesigning entitlement V8 needs to actually
      # execute compiled code, confirmed as a real cause of a device-only
      # crash — see NodeRuntimeController.swift's --jitless comment) the
      # same way real hardware does, so this job's Simulator run can pass
      # while a real device still doesn't. See README.md.
      #
      # build-for-testing (not a plain `build`) so this produces both the
      # app AND the compiled UI test bundle + .xctestrun in one pass --
      # everything the `test` job below (and simulator-test.yml re-run
      # standalone against an older build) needs, without recompiling.
      - name: Build for Simulator (app + UI test bundle)
        run: |
          DERIVED_DATA=/tmp/derived-sim
          xcodebuild build-for-testing \
            -project iPadVSCode.xcodeproj \
            -scheme iPadVSCode \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5)' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-test-build
          path: /tmp/derived-sim/Build/Products

  test:
    name: Simulator smoke test + UI tests
    needs: build
    uses: ./.github/workflows/simulator-test.yml
