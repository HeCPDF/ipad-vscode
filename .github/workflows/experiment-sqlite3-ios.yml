name: Experiment - cross-compile @vscode/sqlite3 for iOS

# Standalone, non-blocking experiment: can prebuild-for-nodejs-mobile
# (https://github.com/staltz/prebuild-for-nodejs-mobile) actually produce an
# ios-arm64 build of @vscode/sqlite3 against our nodejs-mobile fork's Node
# 18.20.x runtime? This does not feed into the main app build yet — it's
# purely to find out whether this path is viable before committing to
# wiring it in. See README.md "Not done yet".

on:
  workflow_dispatch: {}

jobs:
  try-prebuild:
    runs-on: macos-15
    steps:
      - name: Diagnose brew install tmate in isolation
        # A prior tmate debug-session attempt stalled for 7+ minutes with
        # its last output being brew's own "Pouring tmate...done" line —
        # that line is brew's *completion* message for unpacking the
        # bottle, not necessarily the end of the whole `brew install`
        # invocation (post-install hooks / linking run after it and don't
        # always print anything). Testing that hypothesis directly, cheap
        # and fast, before trying the full tmate action again: does a bare
        # `brew install tmate` hang after that same line, or does it
        # actually exit fine and the hang is really in tmate's own network
        # layer (the original hypothesis)? `timeout` + `--verbose --debug`
        # so this fails fast and loud instead of tying up the whole job.
        run: |
          timeout 120 brew install tmate --verbose --debug
          echo "brew install exit code: $?"
        continue-on-error: true

      - name: Xcode version
        run: xcodebuild -version

      - name: Get @vscode/sqlite3 source
        # The published npm package omits binding.gyp/src/deps (prebuilds
        # only) — confirmed by a first attempt at this experiment failing
        # with "No native module (GYP or Rust) found in this folder". The
        # actual GitHub repo has them, but prebuild-for-nodejs-mobile's
        # detector (isGypNodeAddon in bin.js) additionally requires
        # package.json to have `gypfile: true` or a `scripts.install`/
        # `scripts.rebuild` — this package uses node-pre-gyp's `binary`
        # field convention instead, which the detector doesn't recognize
        # even though binding.gyp is genuinely present and valid. Patching
        # gypfile:true into our local build copy (not upstream) satisfies
        # the detector without changing how the module actually builds.
        run: |
          mkdir -p /tmp/sqlite3-src
          git clone --depth 1 --branch v5.1.14-vscode https://github.com/microsoft/vscode-node-sqlite3.git /tmp/sqlite3-src/sqlite3-module
          cd /tmp/sqlite3-src/sqlite3-module
          python3 -c "
          import json
          with open('package.json') as f:
              pkg = json.load(f)
          pkg['gypfile'] = True
          with open('package.json', 'w') as f:
              json.dump(pkg, f, indent=2)
          "
          test -f binding.gyp && echo "binding.gyp present"
          grep gypfile package.json

      - name: Patch binding.gyp to force -fexceptions
        # Confirmed from the actual compile command line (grep for
        # -f*exceptions in a prior run's verbose log): -DNAPI_CPP_EXCEPTIONS
        # is correctly defined (node-addon-api's source correctly opts into
        # try/throw), but the actual clang invocation also carries
        # -fno-exceptions, disabling C++ exceptions at the language level
        # regardless of that macro. binding.gyp's xcode_settings block
        # (which is where CLANG_CXX_LIBRARY etc. live) doesn't apply here —
        # gyp ERR's "make failed" confirms this build uses gyp's make
        # generator, not the Xcode project generator, so xcode_settings is
        # silently ignored; only cflags/cflags_cc are read. Whatever adds
        # -fno-exceptions (nodejs-mobile's or prebuild-for-nodejs-mobile's
        # own iOS cflags, not yet located exactly) must come after the
        # target's own flags on the command line, since clang honors
        # whichever of -f[no-]exceptions appears last — appending
        # -fexceptions directly onto this target's cflags_cc should win.
        run: |
          cd /tmp/sqlite3-src/sqlite3-module
          # binding.gyp allows Python-style # comments, so it isn't strict
          # JSON and json.load() can't parse it (confirmed by a prior
          # attempt: "Expecting property name enclosed in double quotes").
          # A targeted text insertion avoids needing a real GYP parser.
          python3 -c "
          with open('binding.gyp') as f:
              content = f.read()
          marker = '\"target_name\": \"vscode-sqlite3\",'
          assert marker in content, 'target_name marker not found'
          content = content.replace(marker, marker + '\n      \"cflags_cc\": [ \"-fexceptions\" ],', 1)
          with open('binding.gyp', 'w') as f:
              f.write(content)
          "
          grep -A1 "cflags_cc" binding.gyp || true

      - name: Install prebuild-for-nodejs-mobile locally, override its bundled nodejs-mobile-gyp
        # prebuild-for-nodejs-mobile@18.17.7 resolves nodejs-mobile-gyp via
        # `require.resolve(...)`, which walks up from ITS OWN location and
        # finds its own pinned ^0.3.1 nested inside
        # node_modules/prebuild-for-nodejs-mobile/node_modules/ — 0.3.1 is
        # confirmed broken (hardcoded Python-2-only `print` syntax in its
        # version-detection code, crashes regardless of which Python
        # interpreter it's pointed at). Two things that did NOT work before
        # landing on this: (1) `npm install nodejs-mobile-gyp@0.4.0` at the
        # top level only adds a second copy alongside the nested one — 0.x
        # semver ranges aren't compatible enough for npm to hoist/dedupe, so
        # resolution from inside prebuild-for-nodejs-mobile's own code still
        # finds its nested 0.3.1; (2) `cp -R`'ing 0.4.0's folder directly
        # over the nested copy gets the version right but leaves its own
        # transitive deps (e.g. `which`) unresolved/mismatched, crashing
        # differently. A real `npm install` run from inside the nested
        # package's own directory is what actually gets 0.4.0 correctly in
        # place, dependencies included.
        run: |
          mkdir -p /tmp/prebuild-tool
          cd /tmp/prebuild-tool
          npm install prebuild-for-nodejs-mobile@18.17.7
          cd node_modules/prebuild-for-nodejs-mobile
          npm install nodejs-mobile-gyp@0.4.0
          cd /tmp/prebuild-tool
          grep '"version"' node_modules/prebuild-for-nodejs-mobile/node_modules/nodejs-mobile-gyp/package.json

      - name: Attempt ios-arm64 prebuild (round 1, to populate the node-gyp headers cache)
        id: attempt1
        continue-on-error: true
        env:
          PYTHON: /usr/bin/python3
          npm_config_python: /usr/bin/python3
        run: |
          cd /tmp/sqlite3-src/sqlite3-module
          npm install --ignore-scripts
          /tmp/prebuild-tool/node_modules/.bin/prebuild-for-nodejs-mobile ios-arm64 --verbose 2>&1 | tee /tmp/prebuild-round1.log

      - name: Patch the cached common.gypi to allow exceptions/RTTI, then rebuild
        # The real source of -fno-exceptions (confirmed by grepping
        # nodejs-mobile's own bundled Node headers, which ship this exact
        # line): node-gyp's standard common.gypi mechanism applies
        # target_defaults.cflags_cc to EVERY native addon unconditionally —
        # this isn't vscode-sqlite3's binding.gyp or nodejs-mobile-gyp's
        # addon.gypi (checked both, neither mentions exceptions/rtti at
        # all), it's nodejs-mobile's own common.gypi, cached locally by
        # node-gyp after round 1 downloads the Node headers. Patching the
        # cached copy and rebuilding (without re-downloading) is the
        # concrete next step after three attempts at overriding this from
        # the consuming module's own binding.gyp had zero effect.
        run: |
          echo "=== node-gyp's actual --nodedir for this build, from round 1's configure output ==="
          # Confirmed by a prior attempt: it's the copy nested inside
          # prebuild-for-nodejs-mobile's own node_modules
          # (.../prebuild-for-nodejs-mobile/node_modules/nodejs-mobile-react-native/ios/libnode),
          # NOT the top-level one — patching only the top-level copy (an
          # earlier attempt) had zero effect for exactly this reason. A
          # broader `find /` + patch-everything pass after that confirmed
          # the right nested file gets patched correctly, but then hit a
          # permission error on some unrelated system Node install further
          # down the list, aborting the whole step (bash's default -e)
          # before round 2 could run. Scope to /tmp only — that's where
          # nodedir actually points, and it avoids read-only system paths
          # (Xcode's bundled Node install, runner tool caches) entirely.
          grep -i "nodedir dev files" /tmp/prebuild-round1.log | head -5
          echo "=== patch every common.gypi under /tmp ==="
          find /tmp -iname "common.gypi" 2>/dev/null | while read -r f; do
            if grep -q "fno-exceptions" "$f" 2>/dev/null; then
              sed -i.bak "s/'-fno-rtti', '-fno-exceptions', /'-frtti', '-fexceptions', /" "$f" || echo "::warning::sed failed on $f"
              echo "patched: $f"
              grep -n "frtti\|fexceptions" "$f" || true
            fi
          done

      - name: Attempt ios-arm64 prebuild (round 2, after patching common.gypi)
        id: attempt
        continue-on-error: true
        env:
          # Belt-and-suspenders: 0.4.0 is reported to have real Python 3
          # support, but keep forcing python3 explicitly in case some
          # codepath still tries the old python2-first detection dance.
          PYTHON: /usr/bin/python3
          npm_config_python: /usr/bin/python3
        run: |
          cd /tmp/sqlite3-src/sqlite3-module
          rm -rf build
          /tmp/prebuild-tool/node_modules/.bin/prebuild-for-nodejs-mobile ios-arm64 --verbose 2>&1 | tee /tmp/prebuild.log

      - name: Show result
        run: |
          echo "attempt outcome: ${{ steps.attempt.outcome }}"
          find /tmp/sqlite3-src/sqlite3-module -iname "*.node" -o -iname "*ios*" 2>&1 || true

      - name: Dump generated Makefile/.mk rules mentioning exceptions
        # Three attempts at fixing this from the gyp-source level
        # (env vars, target dependency, target cflags_cc) all left the
        # actual compiler invocation unchanged — meaning -fno-exceptions
        # isn't losing an ordering fight in the gyp-generated flags, it's
        # coming from somewhere the target-level source doesn't reach.
        # Read the real generated build files directly instead of guessing
        # further at the gyp-source level.
        if: always()
        run: |
          echo "=== find build dirs ==="
          find /tmp/sqlite3-src/sqlite3-module -type d \( -name build -o -name out \) 2>&1
          echo "=== all Makefile/.mk files ==="
          find /tmp/sqlite3-src/sqlite3-module -iname "Makefile" -o -iname "*.mk" 2>&1
          echo "=== full content of each ==="
          for f in $(find /tmp/sqlite3-src/sqlite3-module -iname "Makefile" -o -iname "*.mk" 2>/dev/null); do
            echo "----- $f -----"
            cat "$f"
          done
          echo "=== grep for exceptions across all of them ==="
          find /tmp/sqlite3-src/sqlite3-module -iname "Makefile" -o -iname "*.mk" 2>/dev/null | xargs grep -n "exceptions" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite3-ios-experiment-log
          path: /tmp/prebuild.log
