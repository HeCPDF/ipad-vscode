name: Experiment - cross-compile @vscode/sqlite3 for iOS

# Standalone, non-blocking experiment: can prebuild-for-nodejs-mobile
# (https://github.com/staltz/prebuild-for-nodejs-mobile) actually produce an
# ios-arm64 build of @vscode/sqlite3 against our nodejs-mobile fork's Node
# 18.20.x runtime? This does not feed into the main app build yet — it's
# purely to find out whether this path is viable before committing to
# wiring it in. See README.md "Not done yet".

on:
  workflow_dispatch: {}

jobs:
  try-prebuild:
    runs-on: macos-15
    steps:
      - name: Xcode version
        run: xcodebuild -version

      - name: Get @vscode/sqlite3 source
        # The published npm package omits binding.gyp/src/deps (prebuilds
        # only) — confirmed by a first attempt at this experiment failing
        # with "No native module (GYP or Rust) found in this folder". The
        # actual GitHub repo has them, but prebuild-for-nodejs-mobile's
        # detector (isGypNodeAddon in bin.js) additionally requires
        # package.json to have `gypfile: true` or a `scripts.install`/
        # `scripts.rebuild` — this package uses node-pre-gyp's `binary`
        # field convention instead, which the detector doesn't recognize
        # even though binding.gyp is genuinely present and valid. Patching
        # gypfile:true into our local build copy (not upstream) satisfies
        # the detector without changing how the module actually builds.
        run: |
          mkdir -p /tmp/sqlite3-src
          git clone --depth 1 --branch v5.1.14-vscode https://github.com/microsoft/vscode-node-sqlite3.git /tmp/sqlite3-src/sqlite3-module
          cd /tmp/sqlite3-src/sqlite3-module
          python3 -c "
          import json
          with open('package.json') as f:
              pkg = json.load(f)
          pkg['gypfile'] = True
          with open('package.json', 'w') as f:
              json.dump(pkg, f, indent=2)
          "
          test -f binding.gyp && echo "binding.gyp present"
          grep gypfile package.json

      - name: Install prebuild-for-nodejs-mobile locally, override its bundled nodejs-mobile-gyp
        # npx installs into an isolated, ephemeral node_modules each time, so
        # there's no way to override one of its transitive deps that way.
        # prebuild-for-nodejs-mobile@18.17.7 resolves nodejs-mobile-gyp via
        # `require.resolve('nodejs-mobile-gyp/bin/node-gyp.js')`, which walks
        # up from its own location — pinned to ^0.3.1 in its package.json,
        # and 0.3.1 is confirmed broken (hardcoded Python-2-only `print`
        # syntax in its version-detection code, crashes regardless of which
        # Python interpreter it's pointed at). Installing the tool for real
        # (not via npx) and then explicitly installing nodejs-mobile-gyp@0.4.0
        # in the same project hoists 0.4.0 to the top-level node_modules,
        # which `require.resolve` finds first.
        run: |
          mkdir -p /tmp/prebuild-tool
          cd /tmp/prebuild-tool
          npm install prebuild-for-nodejs-mobile@18.17.7
          npm install nodejs-mobile-gyp@0.4.0
          npm ls nodejs-mobile-gyp || true
          # Hoisting alone doesn't work here: 0.4.0 (top-level, what we just
          # installed) and ^0.3.1 (prebuild-for-nodejs-mobile's own
          # requirement) aren't semver-compatible as 0.x versions, so npm
          # keeps BOTH — one at top level, one nested inside
          # node_modules/prebuild-for-nodejs-mobile/node_modules/. Node's
          # resolution, called from prebuild-for-nodejs-mobile's own code,
          # finds the nested (old, broken) one first regardless of what's
          # hoisted — confirmed by a prior attempt still showing
          # ".../prebuild-for-nodejs-mobile/node_modules/nodejs-mobile-gyp"
          # in its error output. Force-replace the nested copy directly.
          rm -rf node_modules/prebuild-for-nodejs-mobile/node_modules/nodejs-mobile-gyp
          cp -R node_modules/nodejs-mobile-gyp node_modules/prebuild-for-nodejs-mobile/node_modules/nodejs-mobile-gyp
          # prebuild-for-nodejs-mobile is a CLI-only package (no requireable
          # main), so require.resolve('prebuild-for-nodejs-mobile') itself
          # fails — that's not a sign the replace failed, just a broken way
          # to check it. A plain file check is enough here.
          grep '"version"' node_modules/prebuild-for-nodejs-mobile/node_modules/nodejs-mobile-gyp/package.json

      - name: Attempt ios-arm64 prebuild
        id: attempt
        continue-on-error: true
        env:
          # Belt-and-suspenders: 0.4.0 is reported to have real Python 3
          # support, but keep forcing python3 explicitly in case some
          # codepath still tries the old python2-first detection dance.
          PYTHON: /usr/bin/python3
          npm_config_python: /usr/bin/python3
        run: |
          cd /tmp/sqlite3-src/sqlite3-module
          npm install --ignore-scripts
          /tmp/prebuild-tool/node_modules/.bin/prebuild-for-nodejs-mobile ios-arm64 --verbose 2>&1 | tee /tmp/prebuild.log

      - name: Show result
        run: |
          echo "attempt outcome: ${{ steps.attempt.outcome }}"
          find /tmp/sqlite3-src/sqlite3-module -iname "*.node" -o -iname "*ios*" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite3-ios-experiment-log
          path: /tmp/prebuild.log
