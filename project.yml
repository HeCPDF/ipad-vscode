name: iPadVSCode
options:
  bundleIdPrefix: com.hecpdf.ipadvscode
  # Only the latest iPadOS is a target (currently 26, with 27 in beta) —
  # narrower device support in exchange for using iPadOS 26's menu bar and
  # windowing convergence with macOS instead of working around older,
  # iPhone-shaped UIKit defaults.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO

targets:
  iPadVSCode:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    resources:
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Deprecated on iPadOS 26 (ignored in favor of the new resizable
        # windowing being the default) — left in only for older-SDK clarity,
        # not load-bearing. See UIWindowScene.sizeRestriction in
        # ContentView.swift for the actual iPadOS 26 minimum-size control.
        UIRequiresFullScreen: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Sources/App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hecpdf.ipadvscode
    dependencies:
      - target: NodeRuntimeExtension
        embed: true
      - target: ExtensionHostRuntime
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hecpdf.ipadvscode
        # iPad only ("2"); no iPhone ("1") support.
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  iPadVSCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hecpdf.ipadvscode.uitests
    dependencies:
      - target: iPadVSCode

  NodeRuntimeExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NodeRuntimeExtension
        excludes:
          - "Resources/**"
      - path: Sources/Shared
    resources:
      - path: Sources/NodeRuntimeExtension/Resources/server.js
      # Folder reference (not a group): code-server's build output is tens of
      # thousands of files, and Xcode's per-file "Copy Bundle Resources"
      # phase would be prohibitively slow / prone to CI timeouts at that
      # count. A folder reference copies the directory as one unit instead.
      - path: Sources/NodeRuntimeExtension/Resources/code-server
        type: folder
        optional: true
    info:
      path: Sources/NodeRuntimeExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Sources/NodeRuntimeExtension/NodeRuntimeExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hecpdf.ipadvscode
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    dependencies:
      - framework: Frameworks/NodeMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hecpdf.ipadvscode.noderuntime
        SKIP_INSTALL: YES
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"

  # Second packet-tunnel-provider extension, launched by iPadVSCode alongside
  # NodeRuntimeExtension purely so the real VSCode extension host (unmodified
  # Node exthost, not the browser/web-worker one) has a process to run in.
  # cp.fork() (vscode/src/vs/server/node/extensionHostConnection.ts) can't
  # spawn it directly — iOS denies fork()/posix_spawn() to third-party
  # processes outright — so the system launches this as an independent
  # process instead, and it connects to the same Unix-domain-socket-backed
  # named pipe (TMPDIR pointed at the shared App Group container) that
  # bootstrap-fork.js would have connected to if it really had been forked.
  # See extensionHostConnection.ts patch notes in README.md.
  ExtensionHostRuntime:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ExtensionHostRuntime
      - path: Sources/Shared
    info:
      path: Sources/ExtensionHostRuntime/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ExtensionHostTunnelProvider
    entitlements:
      path: Sources/ExtensionHostRuntime/ExtensionHostRuntime.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hecpdf.ipadvscode
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    dependencies:
      - framework: Frameworks/NodeMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hecpdf.ipadvscode.exthost
        SKIP_INSTALL: YES
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
