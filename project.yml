name: iPadVSCode
options:
  bundleIdPrefix: com.hecpdf.ipadvscode
  # Only the latest iPadOS is a target (currently 26, with 27 in beta) —
  # narrower device support in exchange for using iPadOS 26's menu bar and
  # windowing convergence with macOS instead of working around older,
  # iPhone-shaped UIKit defaults.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO

targets:
  # code-server's server AND the real Node extension host both run in this
  # single target now — no NEPacketTunnelProvider extensions. That
  # architecture (see git history) needed
  # com.apple.developer.networking.networkextension, which Apple restricts
  # to paid Apple Developer Program accounts; a free/Personal Team signing
  # identity gets denied at runtime (NEVPNErrorDomain Code=5, "permission
  # denied") no matter what the entitlements file declares. Background
  # persistence instead comes from UIBackgroundModes: audio (see
  # AudioKeepAlive.swift) -- no special entitlement, works on a free
  # account -- and the extension host is a worker_threads.Worker in the
  # same process (see the code-server fork's
  # patches/ios-exthost-no-fork.diff), since fork()/posix_spawn() is
  # denied to third-party processes regardless of which process asks.
  iPadVSCode:
    type: application
    platform: iOS
    # server.js and code-server are declared as `sources:` entries with an
    # explicit `buildPhase: resources` override rather than under a
    # separate top-level `resources:` key: the latter produced a generated
    # project with literally zero PBXResourcesBuildPhase sections anywhere
    # (verified by downloading the raw generated pbxproj as a CI artifact
    # and grepping it directly — not just a log-rendering issue), for
    # reasons that were not root-caused given no local Xcode/XcodeGen
    # environment to reproduce against. buildPhase: resources on a sources
    # entry is the same well-documented mechanism XcodeGen itself uses
    # internally to route a source into Copy Bundle Resources instead of
    # Compile Sources.
    sources:
      - path: Sources/App
        excludes:
          - "Resources/**"
      - path: Sources/Shared
      - path: Sources/App/Resources/server.js
        buildPhase: resources
      # Folder reference (not a group): code-server's build output is tens
      # of thousands of files, and Xcode's per-file "Copy Bundle
      # Resources" phase would be prohibitively slow / prone to CI
      # timeouts at that count. A folder reference copies the directory
      # as one unit instead.
      - path: Sources/App/Resources/code-server
        type: folder
        optional: true
        buildPhase: resources
      # electron-browser workbench bundle (out-vscode-min), fetched by
      # build.yml the same way as code-server above -- backs
      # VSCodeFileSchemeHandler's vscode-file://vscode-app/... scheme.
      # See README.md's "Architecture pivot" section and
      # NativeWorkbenchExperimentView.swift.
      - path: Sources/App/Resources/vscode-desktop
        type: folder
        optional: true
        buildPhase: resources
      # Tiny (~1s) silent PCM loop AVAudioPlayer plays on repeat to keep
      # the app process alive in the background — see AudioKeepAlive.swift.
      - path: Resources/silence.wav
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Deprecated on iPadOS 26 (ignored in favor of the new resizable
        # windowing being the default) — left in only for older-SDK clarity,
        # not load-bearing. See UIWindowScene.sizeRestriction in
        # ContentView.swift for the actual iPadOS 26 minimum-size control.
        UIRequiresFullScreen: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Exposes Documents/Diagnostics (node-stdio.log — see
        # RuntimeConfig.diagnosticsURL / NodeRuntimeController.swift) in the
        # on-device Files app. A real-device sysdiagnose confirmed the app
        # can die well under a second after launch, before any in-app UI has
        # a chance to render a log viewer or share sheet — this is the only
        # way to retrieve that log with nothing but the iPad itself (no
        # Mac/Xcode to pull the app container).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # No paid-account entitlement needed — a plain Info.plist
        # declaration, honored by iOS for any signing identity. Apple's
        # App Store review rejects apps that declare this without a
        # genuine audio purpose; irrelevant here since this is
        # sideload-only, never submitted for review. See
        # AudioKeepAlive.swift and README.md.
        UIBackgroundModes:
          - audio
    dependencies:
      - framework: Frameworks/NodeMobile.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hecpdf.ipadvscode
        # iPad only ("2"); no iPhone ("1") support.
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"

  iPadVSCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hecpdf.ipadvscode.uitests
    dependencies:
      - target: iPadVSCode
