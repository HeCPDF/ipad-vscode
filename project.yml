name: iPadVSCode
options:
  bundleIdPrefix: com.hecpdf.ipadvscode
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO

targets:
  iPadVSCode:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    resources:
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Sources/App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hecpdf.ipadvscode
    dependencies:
      - target: NodeRuntimeExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hecpdf.ipadvscode
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  NodeRuntimeExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NodeRuntimeExtension
        excludes:
          - "Resources/**"
      - path: Sources/Shared
    resources:
      - path: Sources/NodeRuntimeExtension/Resources/server.js
      # Folder reference (not a group): code-server's build output is tens of
      # thousands of files, and Xcode's per-file "Copy Bundle Resources"
      # phase would be prohibitively slow / prone to CI timeouts at that
      # count. A folder reference copies the directory as one unit instead.
      - path: Sources/NodeRuntimeExtension/Resources/code-server
        type: folder
        optional: true
    info:
      path: Sources/NodeRuntimeExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Sources/NodeRuntimeExtension/NodeRuntimeExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hecpdf.ipadvscode
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    dependencies:
      - framework: Frameworks/NodeMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hecpdf.ipadvscode.noderuntime
        SKIP_INSTALL: YES
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
